<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aula.net — Encontre seu professor particular</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js"></script>
</head>
<body>
<nav class="nav" id="nav"></nav>
<main class="container">
    <section class="hero">
        <h1>Aulas particulares, direto com o professor.</h1>
        <p>Encontre professores autônomos por disciplina, modalidade e preço. Agende, pague à vista ou parcelado
            e avalie suas aulas — tudo em um só lugar.</p>
    </section>

    <section class="card">
        <form id="filtros" class="linha">
            <div><label for="termo">Professor</label><input id="termo" placeholder="Nome do professor"></div>
            <div><label for="disciplina">Disciplina</label><select id="disciplina"><option value="">Todas</option></select></div>
            <div><label for="modalidade">Modalidade</label>
                <select id="modalidade"><option value="">Todas</option><option value="ONLINE">Online</option><option value="PRESENCIAL">Presencial</option></select></div>
            <div><label for="precoMin">Preço/hora mín.</label><input id="precoMin" type="number" min="0" step="5" placeholder="R$"></div>
            <div><label for="precoMax">Preço/hora máx.</label><input id="precoMax" type="number" min="0" step="5" placeholder="R$"></div>
            <div style="flex:0 0 auto"><button class="btn" type="submit">Buscar</button></div>
        </form>
    </section>

    <div class="entre mt-2"><h2 style="margin:0">Professores disponíveis</h2><span class="suave" id="contador"></span></div>
    <section id="resultados" class="grid grid-3 mt"></section>
</main>
<footer>Aula.net — TCC Análise e Desenvolvimento de Sistemas · UEMA</footer>

<script>
    async function carregarDisciplinas() {
        const ds = await Api.get('/api/disciplinas');
        const sel = document.getElementById('disciplina');
        ds.forEach(d => sel.insertAdjacentHTML('beforeend', `<option value="${d.id}">${esc(d.nome)}</option>`));
    }

    async function buscar(ev) {
        if (ev) ev.preventDefault();
        const p = new URLSearchParams();
        const campos = { termo: 'termo', disciplina: 'disciplinaId', modalidade: 'modalidade', precoMin: 'precoMin', precoMax: 'precoMax' };
        Object.entries(campos).forEach(([id, nome]) => { const v = document.getElementById(id).value; if (v) p.set(nome, v); });
        const box = document.getElementById('resultados');
        try {
            const ofertas = await Api.get('/api/ofertas?' + p);
            document.getElementById('contador').textContent = ofertas.length + ' resultado(s)';
            box.innerHTML = ofertas.length ? ofertas.map(o => `
                <article class="card prof-card">
                    <div class="prof-topo">
                        <div class="avatar">${fmt.iniciais(o.professorNome)}</div>
                        <div><h3>${esc(o.professorNome)}</h3><div class="pequeno">${fmt.estrelas(o.mediaAvaliacao)}
                             <span class="suave">(${o.totalAvaliacoes})</span></div></div>
                    </div>
                    <div><strong>${esc(o.disciplina)}</strong> ${selo(o.modalidade)}</div>
                    <div class="entre">
                        <div class="preco">${fmt.moeda(o.valorHora)} <small>/hora</small></div>
                        <a class="btn" href="professor.html?id=${o.professorId}&oferta=${o.id}">Ver perfil</a>
                    </div>
                </article>`).join('') : '<div class="card vazio">Nenhum professor encontrado com esses filtros.</div>';
        } catch (e) { toast(e.message, 'erro'); }
    }

    document.getElementById('filtros').addEventListener('submit', buscar);
    carregarDisciplinas().then(buscar);
</script>
</body>
</html>
