<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta — Aula.net</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js"></script>
</head>
<body>
<nav class="nav" id="nav"></nav>
<main class="container estreito">
    <div class="card mt-2">
        <h2 style="margin-top:0">Criar conta</h2>
        <form id="form">
            <div class="campo"><label>Eu quero</label>
                <select id="papel"><option value="ALUNO">Contratar aulas (Aluno)</option><option value="PROFESSOR">Dar aulas (Professor)</option></select></div>
            <div class="campo"><label for="nome">Nome completo</label><input id="nome" required maxlength="100"></div>
            <div class="campo"><label for="email">E-mail</label><input id="email" type="email" required maxlength="100"></div>
            <div class="linha">
                <div class="campo"><label for="cpf">CPF</label><input id="cpf" placeholder="000.000.000-00" maxlength="14"></div>
                <div class="campo"><label for="telefone">Telefone</label><input id="telefone" placeholder="(98) 9 0000-0000" maxlength="20"></div>
            </div>
            <div class="campo" id="campoBio" style="display:none"><label for="bio">Sobre você (aparece no seu perfil público)</label>
                <textarea id="bio" rows="3" maxlength="1000"></textarea></div>
            <div class="campo"><label for="senha">Senha (mín. 6 caracteres)</label><input id="senha" type="password" required minlength="6"></div>
            <button class="btn btn-bloco" type="submit">Cadastrar</button>
        </form>
        <p class="centro pequeno mt">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
</main>
<script>
    const papel = document.getElementById('papel');
    papel.addEventListener('change', () => document.getElementById('campoBio').style.display = papel.value === 'PROFESSOR' ? 'block' : 'none');
    document.getElementById('form').addEventListener('submit', async ev => {
        ev.preventDefault();
        const v = id => document.getElementById(id).value.trim();
        try {
            const r = await Api.post('/api/auth/cadastro', {
                nome: v('nome'), email: v('email'), cpf: v('cpf') || null, telefone: v('telefone') || null,
                senha: document.getElementById('senha').value, papel: papel.value, bio: v('bio') || null
            });
            Api.salvarSessao(r);
            location.href = Api.paginaInicial(r.usuario.papel);
        } catch (e) { toast(e.message, 'erro'); }
    });
</script>
</body>
</html>
