# Perfil MySQL 8 — banco "aulanetdb" (modelo do MySQL Workbench).
# Ative no IntelliJ: Run > Edit Configurations > Active profiles = mysql
spring.datasource.url=jdbc:mysql://localhost:3306/aulanetdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Fortaleza
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
