spring.application.name=aulanet
server.port=8080
server.error.include-message=always

# ===== Banco H2 em memória (padrão: roda direto no IntelliJ, sem instalar nada) =====
# Para usar MySQL, ative o perfil "mysql" (veja application-mysql.properties e o README).
spring.datasource.url=jdbc:h2:mem:aulanetdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Segurança (RF02 / RNF04) =====
# Em produção, defina a variável de ambiente AULANET_JWT_SECRET (mínimo 32 caracteres).
aulanet.jwt.secret=${AULANET_JWT_SECRET:troque-esta-chave-em-producao-aulanet-uema-2026-0123456789}
aulanet.jwt.expiracao-horas=8

# ===== Financeiro (RF12 / RF13 / RF14) =====
# juros compostos mensais do parcelamento (1,99% a.m.)
aulanet.financeiro.taxa-juros-mensal=0.0199
aulanet.financeiro.max-parcelas=12
# multa de 2% + mora de 0,033% ao dia (≈1% a.m.) sobre parcelas em atraso
aulanet.financeiro.multa-percentual=0.02
aulanet.financeiro.mora-diaria-percentual=0.00033
# comissão padrão da plataforma sugerida ao professor (%)
aulanet.financeiro.comissao-padrao=10.00
aulanet.financeiro.dias-primeiro-vencimento=7
# tarefa agendada diária de atrasos: todo dia às 00:05
aulanet.financeiro.cron-atrasos=0 5 0 * * *

# Cria usuários/aulas de demonstração quando o banco está vazio
aulanet.seed=true
