spring.application.name=aulanet
server.port=8080
server.error.include-message=always

# ===== Banco H2 em memória (padrão: roda direto no IntelliJ, sem instalar nada) =====
# Para usar MySQL, ative o perfil "mysql" (veja application-mysql.properties e o README).
spring.datasource.url=jdbc:h2:mem:aulanetdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
# upload da foto de perfil (o limite de 2 MB por imagem é validado no PerfilService)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# ===== Segurança (RF02 / RNF04) =====
# Em produção, defina a variável de ambiente AULANET_JWT_SECRET (mínimo 32 caracteres).
aulanet.jwt.secret=${AULANET_JWT_SECRET:troque-esta-chave-em-producao-aulanet-uema-2026-0123456789}
aulanet.jwt.expiracao-horas=8

# ===== Financeiro (RF11 a RF14) =====
# juros compostos mensais do parcelamento pela Tabela Price (2% a.m.)
aulanet.financeiro.taxa-juros-mensal=0.02
# carência de juros: até esta quantidade de parcelas não há juros (1 = somente à vista sem juros)
aulanet.financeiro.parcelas-sem-juros=1
aulanet.financeiro.max-parcelas=12
# multa moratória única de 2% (limite do art. 52, § 1º, do CDC)
aulanet.financeiro.percentual-multa=0.02
# juros de mora de 1% ao mês, cobrados proporcionalmente aos dias de atraso (pro rata die)
aulanet.financeiro.juros-mora-mensal=0.01
# comissão padrão da plataforma sugerida ao professor (%)
aulanet.financeiro.comissao-padrao=10.00
aulanet.financeiro.dias-primeiro-vencimento=7
# rotina diária de encargos por atraso: todos os dias, à 1h
aulanet.financeiro.cron-atrasos=0 0 1 * * *

# Cria usuários/aulas de demonstração quando o banco está vazio
aulanet.seed=true
